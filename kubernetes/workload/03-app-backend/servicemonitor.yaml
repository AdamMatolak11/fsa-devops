apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fsa-be
  namespace: app
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: fsa-be
  namespaceSelector:
    matchNames:
      - app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
